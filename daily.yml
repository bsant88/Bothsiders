name: Generate daily Bothsiders issue

on:
  schedule:
    # 13:00 UTC = 6:00 AM Pacific (5:00 AM when daylight saving ends). Cron is always UTC.
    - cron: "0 13 * * *"
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write           # lets the job commit the new pages back to the repo

concurrency:
  group: daily-issue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Research and write today's stories
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_content.py

      - name: Build site pages
        run: python render.py

      - name: Commit and push (this triggers GitHub Pages to redeploy)
        run: |
          git config user.name  "bothsiders-bot"
          git config user.email "bothsiders-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily issue $(date -u +%Y-%m-%d)"
          git push

      - name: Send email to subscribers
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python send_email.py
